services:
  mariadb:
    image: mariadb:10.11
    container_name: aromacraft-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-13781229}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aromacraft}
      MYSQL_USER: ${MYSQL_USER:-aromacraft_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-13781229}
    ports:
      - "3307:3306"
    volumes:
      - aromacraft_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD:-change_this_root_password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  mailhog:
    image: mailhog/mailhog:latest
    container_name: aromacraft-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # HTTP UI
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:8025/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-sms:
    image: node:18-alpine
    container_name: aromacraft-mock-sms
    restart: unless-stopped
    command: ["sh", "-c", "node -e \"const http=require('http');const port=3000;http.createServer((req,res)=>{if(req.method==='POST'&&req.url==='/sms'){let body='';req.on('data',c=>body+=c);req.on('end',()=>{console.log('[mock-sms] POST /sms',body);res.writeHead(200,{'Content-Type':'application/json'});res.end(JSON.stringify({ok:true}));});}else{res.writeHead(404);res.end('Not Found');}}).listen(port);console.log('mock-sms listening on',port);\""]
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aromacraft_mysql_data:

# Notes:
# - MailHog provides a dev SMTP endpoint at smtp://mailhog:1025 and a web UI at http://localhost:8025
# - mock-sms listens on http://mock-sms:3000/sms and logs incoming POST bodies to container logs
