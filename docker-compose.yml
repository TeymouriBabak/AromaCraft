services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: aromacraft-app
    image: aromacraft_app:local
    restart: unless-stopped
    stop_grace_period: 30s
    # Do not run this service simultaneously with the host dev server on port 3000.
    ports:
      - '127.0.0.1:3000:3000'
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      NODE_OPTIONS: --max-old-space-size=1536
      DATABASE_URL: '${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env}'
      REDIS_URL: 'redis://redis:6379'
      DOCKER_ENVIRONMENT: 'true'
      SMS_MOCK_URL: 'http://mock-sms:3000'
      # Docker execution; use the Mailpit service hostname on the Compose network.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      USE_MOCKS: ${USE_MOCKS}
    healthcheck:
      test: ['CMD-SHELL', 'curl -fsS http://localhost:3000/api/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    volumes:
      - ./:/usr/src/app:cached
      - app_node_modules:/usr/src/app/node_modules
      - app_next_cache:/usr/src/app/.next
      - app_prisma_generated:/usr/src/app/src/generated/prisma
      - storage-vol:/usr/src/app/public/uploads
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
      mock-sms:
        condition: service_healthy

  prisma-studio:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    command: ['npx', 'prisma', 'studio', '--hostname', '0.0.0.0', '--port', '5555']
    env_file:
      - .env
    environment:
      NODE_ENV: development
      DATABASE_URL: '${DATABASE_URL_DOCKER:?DATABASE_URL_DOCKER must be set in .env}'
    ports:
      - '127.0.0.1:5555:5555'
    depends_on:
      - mariadb

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: aromacraft-test
    image: aromacraft_test:local
    profiles: ['test']
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-test}
      DATABASE_URL: '${DATABASE_URL:?DATABASE_URL must be set in .env}'
      REDIS_URL: 'redis://redis:6379'
      DOCKER_ENVIRONMENT: 'true'
      SMS_MOCK_ENDPOINT: 'http://mock-sms:3000/sms'
      # Docker execution; use the Mailpit service hostname on the Compose network.
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      USE_MOCKS: ${USE_MOCKS}
    depends_on:
      - mariadb
      - redis
      - mailpit
      - mock-sms
    command: ['npm', 'test']

  mariadb:
    image: mariadb:10.11
    container_name: aromacraft-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}'
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aromacraft}
      MYSQL_USER: ${MYSQL_USER:-aromacraft_user}
      MYSQL_PASSWORD: '${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}'
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - aromacraft_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'mysqladmin ping -h 127.0.0.1 -uroot -p"${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}" >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aromacraft-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6399:6379'
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:latest
    container_name: aromacraft-mailpit
    restart: unless-stopped
    ports:
      - '127.0.0.1:1025:1025' # SMTP
      - '127.0.0.1:8025:8025' # HTTP UI
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://mailpit:8025/api/v1/info >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-sms:
    build:
      context: ./services/sms-mock
      dockerfile: Dockerfile
    container_name: aromacraft-mock-sms
    restart: unless-stopped
    ports:
      # Mock-SMS web UI and API.
      - '127.0.0.1:3001:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -qO- http://127.0.0.1:3000/health >/dev/null 2>&1 || exit 1',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aromacraft_mysql_data:
  redis-data:
  app_node_modules:
  app_next_cache:
  app_prisma_generated:
  storage-vol:
    driver: local

# Notes:
# - Mailpit provides a dev SMTP endpoint at smtp://mailpit:1025 and a web UI at http://localhost:8025
# - mock-sms listens on http://mock-sms:3000/sms and logs incoming POST bodies to container logs
