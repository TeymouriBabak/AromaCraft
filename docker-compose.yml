services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aromacraft-app
    image: aromacraft_app:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      REDIS_URL: "redis://redis:6379"
      DOCKER_ENVIRONMENT: "true"
      SMS_MOCK_URL: "http://mock-sms:3000"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      USE_MOCKS: ${USE_MOCKS}
    volumes:
      - ./:/usr/src/app:cached
      - /usr/src/app/node_modules
      - /usr/src/app/.next
      - /usr/src/app/src/generated/prisma
      - storage-vol:/usr/src/app/public/uploads
    depends_on:
      - mariadb
      - redis
      - mailpit
      - mock-sms

  test:
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    container_name: aromacraft-test
    image: aromacraft_test:local
    profiles: ["test"]
    env_file:
      - .env
    environment:
      NODE_ENV: ${NODE_ENV:-test}
      DATABASE_URL: "${DATABASE_URL:?DATABASE_URL must be set in .env}"
      REDIS_URL: "redis://redis:6379"
      DOCKER_ENVIRONMENT: "true"
      SMS_MOCK_ENDPOINT: "http://mock-sms:3000/sms"
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      USE_MOCKS: ${USE_MOCKS}
    depends_on:
      - mariadb
      - redis
      - mailpit
      - mock-sms
    command: ["npm", "test"]

  mariadb:
    image: mariadb:10.11
    container_name: aromacraft-mariadb
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}"
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aromacraft}
      MYSQL_USER: ${MYSQL_USER:-aromacraft_user}
      MYSQL_PASSWORD: "${MYSQL_PASSWORD:?MYSQL_PASSWORD must be set in .env}"
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - aromacraft_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}\" >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: aromacraft-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6399:6379"
    volumes:
      - redis-data:/data

  mailpit:
    image: axllent/mailpit:latest
    container_name: aromacraft-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025" # SMTP
      - "127.0.0.1:8025:8025" # HTTP UI
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://mailpit:8025/api/v1/info >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  mock-sms:
    image: node:18-alpine
    container_name: aromacraft-mock-sms
    restart: unless-stopped
    command: ["sh", "-c", "node -e \"const http=require('http');const port=3000;http.createServer((req,res)=>{if(req.method==='POST'&&req.url==='/sms'){let body='';req.on('data',c=>body+=c);req.on('end',()=>{console.log('[mock-sms] POST /sms',body);res.writeHead(200,{'Content-Type':'application/json'});res.end(JSON.stringify({ok:true}));});}else{res.writeHead(404);res.end('Not Found');}}).listen(port);console.log('mock-sms listening on',port);\""]
    ports:
      - "127.0.0.1:3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://mock-sms:3000/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  aromacraft_mysql_data:
  redis-data:
  storage-vol:
    driver: local

# Notes:
# - Mailpit provides a dev SMTP endpoint at smtp://mailpit:1025 and a web UI at http://localhost:8025
# - mock-sms listens on http://mock-sms:3000/sms and logs incoming POST bodies to container logs
